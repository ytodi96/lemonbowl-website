name: deploy-static-site

# Publishes static-site/ to GitHub Pages.
# Manual for now: Pages needs the repo to be public on a free plan.
# Once public, enable Pages (Settings > Pages > Source: GitHub Actions) and add `push: branches: [main]`.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-site
      - id: deployment
        uses: actions/deploy-pages@v4
